<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000080">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treinador">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Treinador Retrô</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#1d3f94; --bg2:#173378; --panel:#c3c3c3; --panel2:#dfdfdf; --text:#000; --muted:#3c3c3c;
  --hi:#ffffff; --sh:#7b7b7b; --dk:#000; --t1:#000080; --t2:#1084d0; --tt:#fff;
  --field:#ffffff; --row:#f1f1f1; --sel:#000080; --selt:#fff; --me:#fff7b0; --good:#0a7d14; --bad:#b30000;
  --led:#ffd400; --ledbg:#000; --clock:#38ff4c;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08122c; --bg2:#060d20; --panel:#2c3038; --panel2:#3b404a; --text:#ebebeb; --muted:#a9aeb8;
    --hi:#5b616d; --sh:#15171b; --dk:#000; --t1:#0b1d66; --t2:#2a5fd6; --tt:#fff;
    --field:#1b1e24; --row:#22262d; --sel:#3d6bff; --selt:#fff; --me:#4a4413; --good:#4cd964; --bad:#ff6b6b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08122c; --bg2:#060d20; --panel:#2c3038; --panel2:#3b404a; --text:#ebebeb; --muted:#a9aeb8;
  --hi:#5b616d; --sh:#15171b; --dk:#000; --t1:#0b1d66; --t2:#2a5fd6; --tt:#fff;
  --field:#1b1e24; --row:#22262d; --sel:#3d6bff; --selt:#fff; --me:#4a4413; --good:#4cd964; --bad:#ff6b6b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;color:var(--text);font:14px/1.3 Tahoma,Verdana,"Segoe UI",Arial,sans-serif;
  background:repeating-linear-gradient(0deg,var(--bg) 0 22px,var(--bg2) 22px 44px);-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
#top{background:linear-gradient(90deg,var(--t1),var(--t2));color:var(--tt);padding:6px 8px;display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--dk)}
#top .money{margin-left:auto;font-family:VT323,ui-monospace,monospace;font-size:22px;color:var(--led);background:#000;padding:0 6px;border:1px solid #555}
#top .sub{font-size:11px;opacity:.85}
.logo{font-family:VT323,ui-monospace,monospace;font-size:30px;letter-spacing:1px}
.logo span{color:var(--led)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px;-webkit-overflow-scrolling:touch}
nav{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:4px;background:var(--panel);border-top:2px solid var(--hi)}
.win{background:var(--panel);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--sh);margin-bottom:8px}
.tb{background:linear-gradient(90deg,var(--t1),var(--t2));color:var(--tt);font-weight:bold;padding:3px 6px;font-size:13px;display:flex;align-items:center;gap:6px}
.pc{padding:8px}
.inset{background:var(--field);border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh)}
.btn{font:inherit;font-size:13px;color:var(--text);background:var(--panel);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--sh);padding:6px 10px;cursor:pointer;min-height:36px}
.btn:active,.btn.on{border-color:var(--dk) var(--hi) var(--hi) var(--dk);box-shadow:inset 1px 1px var(--sh)}
.btn.on{background:var(--panel2);font-weight:bold}
.btn:focus-visible,.nb:focus-visible{outline:2px dotted var(--text);outline-offset:-5px}
.btn.big{font-size:18px;font-weight:bold;width:100%;padding:10px;min-height:50px}
.btn.sm{padding:3px 8px;min-height:30px;font-size:12px}
.btn:disabled{color:var(--sh)}
.nb{font:inherit;font-size:9.5px;color:var(--text);background:var(--panel);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.nb b{font-size:18px;font-weight:normal;line-height:1.1}
.nb.on{border-color:var(--dk) var(--hi) var(--hi) var(--dk);background:var(--panel2);font-weight:bold}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.chip{display:inline-block;padding:2px 6px;font-weight:bold;border:1px solid rgba(0,0,0,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-size:13px;vertical-align:middle;line-height:1.25}
.chip.s{font-size:11px;padding:1px 4px}
.muted{color:var(--muted);font-size:12px}
.led{font-family:VT323,ui-monospace,monospace;background:var(--ledbg);color:var(--led);padding:0 6px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;margin:6px 0 10px}
.vs .chip{font-size:16px;padding:6px 8px;width:100%}
.vs .x{font-family:VT323,monospace;font-size:28px}
/* Ao vivo */
.lhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.clock{font-family:VT323,ui-monospace,monospace;font-size:46px;line-height:40px;background:#000;color:var(--clock);padding:2px 12px;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);min-width:96px;text-align:center}
.clock.ht{color:var(--led)}
.dtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:8px}
.mrow{background:var(--field);border-bottom:1px solid var(--panel);padding:5px 4px}
.mrow:nth-child(even){background:var(--row)}
.mrow.me{background:var(--me);outline:2px solid var(--led);outline-offset:-2px}
.ml{display:grid;grid-template-columns:minmax(0,1fr) 30px 30px minmax(0,1fr);gap:4px;align-items:center}
.ml .hc{text-align:right}
.sc{font-family:VT323,ui-monospace,monospace;font-size:26px;line-height:24px;text-align:center;background:#000;color:var(--led)}
.sc.fl{background:var(--led);color:#000}
.evs{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:11px;color:var(--muted);margin-top:2px}
.evs .evh{text-align:right}
.pen{text-align:center;font-size:11px;font-weight:bold}
.pub{text-align:center;font-size:10px;color:var(--muted);margin-top:2px}
.pin{margin-bottom:8px}
/* Tabelas */
table.t{width:100%;border-collapse:collapse;font-size:12px;background:var(--field)}
table.t th{background:var(--panel2);font-weight:bold;padding:4px 2px;text-align:center;border-bottom:1px solid var(--sh)}
table.t td{padding:4px 2px;border-bottom:1px solid var(--panel);text-align:center}
table.t td.l,table.t th.l{text-align:left}
table.t tr.me td{background:var(--me);font-weight:bold}
table.t tr.up td:first-child{box-shadow:inset 4px 0 var(--good)}
table.t tr.dn td:first-child{box-shadow:inset 4px 0 var(--bad)}
table.t td .chip{max-width:150px}
.scroll{overflow-x:auto}
/* Plantel */
.pl{display:grid;grid-template-columns:34px minmax(0,1fr) 26px 30px 36px 70px;gap:4px;align-items:center;padding:5px 4px;border-bottom:1px solid var(--panel);background:var(--field);font-size:13px}
.pl:nth-child(even){background:var(--row)}
.pl.hd{background:var(--panel2);font-weight:bold;font-size:11px}
.pl .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.pl .n small{color:var(--muted)}
.dot{width:28px;height:28px;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);background:var(--field);cursor:pointer;font-size:15px;padding:0;color:var(--good)}
.pos{font-weight:bold;text-align:center}
.pos.G{color:#c27c00}.pos.D{color:#1565c0}.pos.M{color:var(--good)}.pos.A{color:var(--bad)}
.sk{font-family:VT323,monospace;font-size:20px;text-align:center}
.r{text-align:right}
.mk{grid-template-columns:minmax(0,1fr) 26px 30px 36px 78px}
.pl.sel{outline:2px solid var(--sel);outline-offset:-2px}
/* Modal + toast */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
#modal.open{display:flex}
#modal .win{width:100%;max-width:540px;max-height:86%;overflow:auto;margin:0}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#ffffe1;color:#000;border:1px solid #000;padding:8px 12px;font-size:13px;z-index:60;display:none;max-width:90%;box-shadow:2px 2px 0 #000}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.kv b{text-align:right}
.news div{padding:4px 0;border-bottom:1px dotted var(--sh);font-size:12px}
.cty{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-bottom:8px}
.clist .it{display:flex;align-items:center;gap:8px;padding:7px 6px;border-bottom:1px solid var(--panel);background:var(--field);cursor:pointer}
.clist .it:nth-child(even){background:var(--row)}
.dl{font-weight:bold;padding:6px 4px 3px;font-size:12px}
.nk{font-size:11px;color:var(--muted);font-weight:normal}
details.rules>summary{cursor:pointer;list-style:none}
details.rules>summary::-webkit-details-marker{display:none}
details.rules>summary::after{content:'▸';margin-left:auto}
details.rules[open]>summary::after{content:'▾'}
details.rules p{margin:0 0 8px;font-size:13px}
.clist .it.sel{outline:3px solid var(--sel);outline-offset:-3px;background:var(--me)}
.cbar{position:sticky;bottom:0;padding:8px 0 4px;background:var(--bg);z-index:5}
.close{margin-left:auto;background:var(--panel);color:var(--text);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);width:24px;height:22px;font-size:12px;line-height:1;padding:0;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function setSlots(L){try{localStorage.setItem(KEY+':idx',JSON.stringify(L))}catch(e){}}
function save(){if(!S)return;if(!S.slot)S.slot=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  try{localStorage.setItem(KEY+':'+S.slot,JSON.stringify(S));setSlots([slotEntry(S)].concat(slots().filter(x=>x.id!==S.slot)))}catch(e){toast('Sem espaço para salvar: apague uma carreira antiga na tela inicial')}}
function loadSlot(id){try{const s=localStorage.getItem(KEY+':'+id);return s?JSON.parse(s):null}catch(e){return null}}
function legacy(){try{const s=localStorage.getItem(KEY);if(!s)return;const o=JSON.parse(s);o.slot='antigo';localStorage.setItem(KEY+':antigo',JSON.stringify(o));
  setSlots([slotEntry(o)].concat(slots().filter(x=>x.id!=='antigo')));localStorage.removeItem(KEY)}catch(e){}}
function b64(u){let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function unb64(t){const s=atob(t.replace(/\s+/g,''));const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
async function packSave(o){const txt=JSON.stringify(o);
  if(window.CompressionStream){try{const cs=new Blob([txt]).stream().pipeThrough(new CompressionStream('gzip'));return 'TRZ:'+b64(new Uint8Array(await new Response(cs).arrayBuffer()))}catch(e){}}
  return 'TRJ:'+b64(new TextEncoder().encode(txt))}
async function unpackSave(t){t=t.trim();if(t.startsWith('{'))return JSON.parse(t);
  if(t.startsWith('TRZ:')){const ds=new Blob([unb64(t.slice(4))]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(ds).text())}
  if(t.startsWith('TRJ:'))return JSON.parse(new TextDecoder().decode(unb64(t.slice(4))));throw new Error('formato')}
async function exportSlot(id){if(!id&&S)save();const o=id?loadSlot(id):S;if(!o)return toast('Carreira não encontrada');modal('Exportar carreira','<p class="muted">Gerando o código de backup…</p>');
  const code=await packSave(o),u=o.clubs[o.user];UI.expCode=code;
  modal('Exportar carreira',`<p>Backup da carreira com o ${chip(u,1)}, temporada ${o.season}/${String(o.season+1).slice(-2)}. Copie o código e guarde onde quiser: e-mail, bloco de notas ou WhatsApp para você mesmo. Para recuperar, use <b>Importar carreira</b> na tela inicial, em qualquer aparelho.</p>

  <p class="muted" style="margin:4px 0 8px">${fN(code.length)} caracteres. Copie o código inteiro.</p><div class="row"><button class="btn" style="flex:1" onclick="copyExp()">Copiar código</button>${location.protocol==='file:'?'<button class="btn" style="flex:1" onclick="dlExp()">Baixar arquivo</button>':''}</div>`)}
async function copyExp(){try{await navigator.clipboard.writeText(UI.expCode);toast('Código copiado')}catch(e){const t=document.getElementById('expTx');t.focus();t.select();try{document.execCommand('copy');toast('Código copiado')}catch(e2){toast('Selecione o texto e copie manualmente')}}}
function dlExp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([UI.expCode],{type:'text/plain'}));a.download='carreira-treinador-retro.txt';document.body.appendChild(a);a.click();a.remove()}
function importUI(){modal('Importar carreira',`<p>Cole o código de backup gerado em <b>Exportar carreira</b>, ou escolha o arquivo de backup.</p><textarea id="impTx" placeholder="Cole o código aqui" style="width:100%;height:110px;font:12px ui-monospace,monospace;background:var(--field);color:var(--text)"></textarea>
  <input type="file" id="impFile" accept=".txt,.json,text/plain,application/json" style="margin:6px 0;max-width:100%" onchange="impFile(this)"><button class="btn big" onclick="doImport()">Importar</button>`)}
function impFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{document.getElementById('impTx').value=r.result;toast('Arquivo carregado: toque em Importar')};r.readAsText(f)}
async function doImport(){const t=document.getElementById('impTx').value;if(!t.trim())return toast('Cole o código primeiro');let o;
  try{o=await unpackSave(t)}catch(e){return toast('Código inválido ou incompleto')}
  if(!o||!Array.isArray(o.clubs)||o.clubs[o.user]==null)return toast('Esse código não é de uma carreira válida');
  o.slot=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  try{localStorage.setItem(KEY+':'+o.slot,JSON.stringify(o));setSlots([slotEntry(o)].concat(slots()))}catch(e){return toast('Sem espaço: apague uma carreira antiga')}
  closeModal();toast('Carreira importada');rStart()}
function askDel(id){const x=slots().find(y=>y.id===id);if(!x)return;modal('Apagar carreira',`<p>Apagar a carreira com o <span class="chip" style="background:${x.c1};color:${x.c2}">${x.club}</span>? Não dá para desfazer.</p><div class="row"><button class="btn" style="flex:1" onclick="delSlot('${id}')">Apagar</button><button class="btn" style="flex:1" onclick="closeModal()">Cancelar</button></div>`)}
function delSlot(id){try{localStorage.removeItem(KEY+':'+id)}catch(e){}setSlots(slots().filter(x=>x.id!==id));closeModal();rStart()}
function news(t){S.news.unshift(`[${season()}] ${t}`);S.news=S.news.slice(0,25)}
function modal(title,html){$('#modal').innerHTML=`<div class="win"><div class="tb">${title}<button class="close" onclick="closeModal()" aria-label="Fechar">✕</button></div><div class="pc">${html}</div></div>`;$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open');$('#modal').innerHTML='';if(LIVE&&LIVE.autoP){LIVE.autoP=false;LIVE.paused=false;renderLive()}}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&(!LIVE||LIVE.autoP))closeModal()});

/* ===================== JOGADORES ===================== */
function genName(cty){const nat=Math.random()<0.78?cty:pick(DS[(S&&S.ds)||'0506'].codes);const P=NAMES[nat];
  if(nat==='BRA'&&Math.random()<0.3)return{n:pick(P.nick),nat};return{n:pick(P.f)+' '+pick(P.s),nat}}
function genPlayer(cty,pos,base,age){const nm=genName(cty);
  return{id:S.nextPid++,n:nm.n,nat:nm.nat,p:pos,a:age!=null?age:RI(18,34),s:clamp(Math.round(base+R(-9,7)),25,97),g:0,rf:0}}
function value(p){const f=p.a<=21?1.3:p.a<=25?1.15:p.a<=29?1:p.a<=32?0.7:0.4;return Math.round(Math.pow(p.s,4)/3*f/1e4)*1e4}
const wage=p=>value(p)/130;
const wages=c=>c.pl.reduce((t,p)=>t+wage(p),0);
function addYouth(c){const need={G:3,D:7,M:7,A:5};c.pl.forEach(p=>need[p.p]--);
  let pos='M',mx=-99;for(const k in need)if(need[k]>mx){mx=need[k];pos=k}
  const p=genPlayer(c.cty,pos,c.str-10,RI(17,19));p.s=clamp(p.s,DMIN[c.div-1],DMAX[c.div-1]);c.pl.push(p);return p}

/* ===================== CLUBES / TEMPORADA ===================== */
function buildWorld(ds,assign){const D=DS[ds];
  S={season:D.year,ds,ver:10,coach:'Treinador',atg:{},clubs:[],nextPid:1,user:-1,speed:1,pauseHT:true,price:30,news:[],last:[],fin:{gate:0,att:0,tv:0,wages:0},hist:[]};
  let id=0;
  D.codes.forEach(cty=>D.data[cty].forEach((d,i)=>{
    if(assign?!assign[d[0]]:i>=8)return;const div=assign?assign[d[0]]:Math.floor(i/2)+1;
    const str=DIVBASE[div-1]+CTYMOD[cty]-(assign?1:(i%2)*2)+(PRESTIGE[d[0]]||0);
    const c={id:id++,name:d[0],sh:d[1],st:d[2],cap:d[3],c1:d[4],c2:d[5],cty,div,str,money:[150e6,60e6,25e6,10e6][div-1]*(1+(PRESTIGE[d[0]]||0)/4),
      pl:[],form:pick(['4-4-2','4-4-2','4-3-3','4-5-1','3-5-2']),lu:[],t:null};
    const real=D.sq[d[0]]?D.sq[d[0]].split('|').map(t=>t.match(/^([GDMA]) (.+) (\d+) (\d+)$/)).filter(Boolean):[];
    if(real.length){const mean=real.reduce((t,m)=>t+ +m[3],0)/real.length,off=real.length>=14?1:4;
      real.forEach(m=>c.pl.push({id:S.nextPid++,n:m[2],nat:null,p:m[1],a:+m[4],s:clamp(Math.round(str+off+(+m[3]-mean)),25,99),g:0,rf:0}));
      const base=real.length>=14?str-6:str-1;
      while(c.pl.length<22){const y=addYouth(c);y.a=RI(18,31);y.s=clamp(Math.round(base+R(-8,6)),25,92)}}
    else{const ps=[['G',3],['D',7],['M',7],['A',5]];
      ps.forEach(([p,n])=>{for(let k=0;k<n;k++)c.pl.push(genPlayer(cty,p,str))});
      shuffle(c.pl.filter(p=>p.p!=='G')).slice(0,2).forEach(p=>p.s=clamp(p.s+RI(5,10),25,97))}
    c.pl.forEach(p=>p.s=clamp(p.s,DMIN[div-1],DMAX[div-1]));c.pl.forEach(p=>{if(p.nat===null&&FIXS[p.n])p.s=FIXS[p.n]});S.clubs.push(c);
  }));
  S.clubs.forEach(c=>{c.coach=coachFor(c.name,c.cty);autoLineup(c)});return S}
function preWorld(ds,assign){const key=ds+(assign?JSON.stringify(assign):'');if(!UI.pre||UI.preKey!==key){const keep=S;UI.pre=buildWorld(ds,assign);UI.preKey=key;S=keep}return UI.pre}
const curWorld=()=>preWorld(UI.ds,UI.mode==='free'?UI.assign:null);
function newGame(ds,uid,cname){S=preWorld(ds,UI.mode==='free'?UI.assign:null);UI.pre=null;UI.preKey=null;S.user=uid;S.fan=60;S.board=60;S.warn=0;S.coach=(cname||'').trim().slice(0,30)||'Treinador';const u=club(uid);u.money=START[u.div-1];u.form='4-4-2';autoLineup(u);
  news(`Você assumiu o ${u.name}. Orçamento inicial: ${fm(u.money)}.`);
  initSeason();save();UI.tab='home';closeModal();render();
}
function newClub(cty,d,div,id){const D=DS[S.ds||'0506'],str=DIVBASE[div-1]+CTYMOD[cty]-1+(PRESTIGE[d[0]]||0);
  const c={id,name:d[0],sh:d[1],st:d[2],cap:d[3],c1:d[4],c2:d[5],cty,div,str,money:[150e6,60e6,25e6,10e6][div-1],pl:[],form:pick(['4-4-2','4-4-2','4-3-3','4-5-1','3-5-2']),lu:[],t:null};c.coach=coachFor(d[0],cty);
  const have=new Set();S.clubs.forEach(x=>x.pl.forEach(p=>{if(p.nat===null)have.add(p.n)}));
  const real=D.sq[d[0]]?D.sq[d[0]].split('|').map(t=>t.match(/^([GDMA]) (.+) (\d+) (\d+)$/)).filter(Boolean):[];
  if(real.length){const mean=real.reduce((t,m)=>t+ +m[3],0)/real.length,off=real.length>=14?1:4;
    real.forEach(m=>{if(!have.has(m[2]))c.pl.push({id:S.nextPid++,n:m[2],nat:null,p:m[1],a:+m[4],s:clamp(Math.round(str+off+(+m[3]-mean)),25,99),g:0,rf:0})})}
  const base=real.length>=14?str-6:str;while(c.pl.length<22){const y=addYouth(c);y.a=RI(18,31);y.s=clamp(Math.round(base+R(-9,7)),25,95)}
  c.pl.forEach(p=>{if(p.nat===null&&FIXS[p.n])p.s=FIXS[p.n]});autoLineup(c);return c}
function roundRobin(ids){const n=ids.length,arr=shuffle(ids.slice()),rounds=[],hc={},last={};ids.forEach(i=>{hc[i]=0;last[i]=''});
  for(let r=0;r<n-1;r++){const rd=[];for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];let home;
    if(last[a]==='C'&&last[b]!=='C')home=b;else if(last[b]==='C'&&last[a]!=='C')home=a;else if(hc[a]!==hc[b])home=hc[a]<hc[b]?a:b;else home=Math.random()<0.5?a:b;
    const away=home===a?b:a;rd.push([home,away]);hc[home]++;last[home]='C';last[away]='F'}rounds.push(rd);arr.splice(1,0,arr.pop())}
  return rounds.concat(rounds.map(rd=>rd.map(([h,a])=>[a,h])))}
function initSeason(){
  S.clubs.forEach(c=>{c.t={J:0,V:0,E:0,D:0,GP:0,GC:0};c.pl.forEach(p=>{p.g=0;p.rf=0;p.yc=0;p.sus=0;p.inj=0;p.pj=0;p.mi=0;p.yy=0;p.rr=0;p.fit=100;p.bc=0;p.unh=false;p.sg=0});c.chem=Math.min(100,(c.chem??90)+15);autoLineup(c)});
  S.fx={};for(let d=1;d<=4;d++)S.fx[d]=roundRobin(S.clubs.filter(c=>c.div===d).map(c=>c.id));
  const L=S.fx[1].length;S.nr=L;S.cup={round:0,alive:S.clubs.map(c=>c.id),byes:[],pairs:[],last:[],champ:null};
  const N=S.clubs.length;let P=1;while(P*2<=N)P*=2;const CR=Math.log2(P)+(N>P?1:0);S.cup.nrounds=CR;S.cup.pre=N>P;
  const k=Math.max(1,Math.floor(L/(CR+1)));S.cal=[];let cr=0;
  for(let r=0;r<L;r++){S.cal.push({t:'L',r});if((r+1)%k===0&&cr<CR)S.cal.push({t:'C',cr:cr++})}
  while(cr<CR)S.cal.push({t:'C',cr:cr++});cupDraw();
  S.ev=0;S.over=false;S.last=[];S.przS=0;if(S.led)S.ledPrev=S.led;S.led={};S.warn=S.carryWarn?1:0;S.alert=S.carryWarn?'A diretoria começa a temporada desconfiada: os resultados precisam aparecer.':null;S.carryWarn=0;S.lst=0;if(S.board!=null)S.board=55+(S.board-55)*0.5;setGoal();
}
function cupName(cr){const c=S.cup;if(cr===0&&c.pre)return '1ª eliminatória';
  return ({1:'Final',2:'Semifinal',3:'Quartas de final',4:'Oitavas de final',5:'16-avos de final',6:'32-avos de final'})[c.nrounds-cr]||'1ª eliminatória'}
function cn(v){if(typeof v==='string')return v;const c=club(v);return c?c.name:'—'}
function cupDraw(){const c=S.cup;let pool;const N=c.alive.length;let P=1;while(P*2<=N)P*=2;shuffle(c.alive);
  if(N>P){const nb=2*P-N;c.byes=c.alive.slice(0,nb);pool=c.alive.slice(nb)}else{c.byes=[];pool=c.alive.slice()}
  c.pairs=[];for(let i=0;i<pool.length;i+=2)c.pairs.push([pool[i],pool[i+1]])}
function standings(d){return S.clubs.filter(c=>c.div===d).sort((a,b)=>pts(b)-pts(a)||(b.t.GP-b.t.GC)-(a.t.GP-a.t.GC)||b.t.GP-a.t.GP||a.name.localeCompare(b.name))}
const pts=c=>c.t.V*3+c.t.E;
function autoLineup(c){const [d,m,a]=FORM[c.form];const by=pos=>c.pl.filter(p=>p.p===pos&&avail(p)).sort((x,y)=>eff(y)-eff(x));const lu=[];
  const take=(arr,n)=>arr.slice(0,n).forEach(p=>lu.push(p.id));take(by('G'),1);take(by('D'),d);take(by('M'),m);take(by('A'),a);
  if(lu.length<11){for(const p of c.pl.filter(p=>p.p!=='G'&&!lu.includes(p.id)&&avail(p)).sort((x,y)=>eff(y)-eff(x))){if(lu.length>=11)break;lu.push(p.id)}}
  c.lu=lu}
function lineupOk(c){c.lu=c.lu.filter(id=>c.pl.some(p=>p.id===id&&avail(p)));return c.lu.length===11}
function fillLu(c){const [d,m,a]=FORM[c.form],need={G:1,D:d,M:m,A:a};c.lu.forEach(id=>{const p=c.pl.find(x=>x.id===id);if(p)need[p.p]--});
  const pool=c.pl.filter(p=>avail(p)&&!c.lu.includes(p.id)).sort((x,y)=>y.s-x.s);
  for(const k of ['G','D','M','A'])while(need[k]>0&&c.lu.length<11){const p=pool.find(x=>x.p===k&&!c.lu.includes(x.id));if(!p)break;c.lu.push(p.id);need[k]--}
  for(const p of pool){if(c.lu.length>=11)break;if(!c.lu.includes(p.id)&&p.p!=='G')c.lu.push(p.id)}}

/* ===================== MOTOR DE JOGO ===================== */
function pmap(c){const m={};c.pl.forEach(p=>m[p.id]=p);return m}
const fitF=p=>0.9+0.1*Math.max(0,Math.min(100,p.fit??100))/100;
const eff=p=>p.s*fitF(p);
function rate(map,ids){let G=0,g=0,D=0,M=0,A=0,minD=999,nd=0;
  ids.forEach(id=>{const p=map[id];if(!p)return;const v=eff(p);if(p.p==='G'){if(v>G)G=v;g++}else if(p.p==='D'){D+=v;nd++;if(v<minD)minD=v}else if(p.p==='M')M+=v;else A+=v});
  if(!g)G=20;const def=Math.max(10,(G*2+D+M*0.5+A*0.1)/8.2);
  return{att:Math.max(10,(A+M*0.5+D*0.1)/4.4),def:Math.max(10,def*0.85+0.15*(nd?minD:30))}}
function teamK(c){const chem=c.chem??90,st=DIVBASE[c.div-1]+16,stars=c.pl.filter(p=>p.s>=st).length,unh=c.pl.filter(p=>p.unh).length;
  return (0.94+0.06*chem/100)*(1-Math.min(0.04,0.01*Math.max(0,stars-4))-Math.min(0.03,0.01*unh))}
function posPen(c,ids){const [d,m,a]=FORM[c.form],n={G:0,D:0,M:0,A:0};ids.forEach(id=>{const p=c.pl.find(x=>x.id===id);if(p)n[p.p]++});
  const mD=Math.max(0,d-n.D),mM=Math.max(0,m-n.M),mA=Math.max(0,a-n.A);return{a:(1-0.05*mA)*(1-0.025*mM),d:(1-0.06*mD)*(1-0.025*mM)}}
function rr(m,s){const r=rate(m['m'+s],m['l'+s]),k=m['k'+s]||1,pp=m['p'+s]||{a:1,d:1};return{att:r.att*k*pp.a,def:r.def*k*pp.d}}
function condUpdate(C,played){C.chem=Math.min(100,(C.chem??90)+3);const st=DIVBASE[C.div-1]+16;
  C.pl.forEach(p=>{const pl=played.includes(p.id);
    p.fit=pl?Math.max(50,(p.fit??100)-(4+Math.max(0,p.a-30)*0.5)):Math.min(100,(p.fit??100)+15);
    if(p.s>=st&&avail(p)){if(pl){p.bc=0;if(p.unh){p.unh=false;if(C.id===S.user)news(`🙂 ${p.n} voltou a ficar contente no elenco.`)}}
      else{p.bc=(p.bc||0)+1;if(p.bc>=3&&!p.unh){p.unh=true;if(C.id===S.user)news(`😠 ${p.n} está insatisfeito por ficar no banco e afeta o vestiário.`)}}}})}
function mk(h,a,d,cup){const H=club(h),A=club(a);
  if(h!==S.user)autoLineup(H);if(a!==S.user)autoLineup(A);
  const m={h,a,d,cup,gh:0,ga:0,ev:[],lh:H.lu.slice(),la:A.lu.slice(),s0h:H.lu.slice(),s0a:A.lu.slice(),oh:[],oa:[],mh:pmap(H),ma:pmap(A),lg:null,lgs:null,pend:[],yc:{},sc:{h:0,a:0}};
  m.kh=teamK(H);m.ka=teamK(A);m.ph=posPen(H,m.lh);m.pa=posPen(A,m.la);
  {const bh=rate(m.mh,m.lh),ba=rate(m.ma,m.la),sh=bh.att+bh.def,sa=ba.att+ba.def;if(MOT.has(a)&&sh<sa)m.kh*=1.04;if(MOT.has(h)&&sa<sh)m.ka*=1.04}
  {const af=(ids,map)=>ids.reduce((t,id)=>t+(map[id].fit??100),0)/Math.max(1,ids.length);m.fh=1+(100-af(m.lh,m.mh))/60;m.fa=1+(100-af(m.la,m.ma))/60}
  m.rh=rr(m,'h');m.ra=rr(m,'a');m.att=attendance(H,A,cup);return m}
function scorer(m,s){const ids=m['l'+s],map=m['m'+s];let tot=0;const w=ids.map(id=>{const p=map[id];const k=POSW[p.p]*p.s;tot+=k;return k});
  let r=Math.random()*tot;for(let i=0;i<ids.length;i++){r-=w[i];if(r<=0)return map[ids[i]]}return map[ids[ids.length-1]]}
function nick(p,c){c=c||S.clubs.find(k=>k.pl.includes(p));if(!c)return'';const base=DIVBASE[c.div-1],pj=p.pj||0,g=p.g||0,yy=p.yy||0,rr=p.rr||0,mi=p.mi||0;
  if(p.unh)return'Insatisfeito';
  if(p.p!=='G'&&p.p!=='D'&&pj>=5&&g/pj>=0.6)return'Matador';
  if(g>=10)return'Artilheiro';
  if((p.sg||0)>=2)return'Talismã';
  if(p.p==='G'&&pj>=8){const L=S.clubs.filter(k=>k.div===c.div&&k.t);if(L.length&&c.t&&c.t.GC===Math.min(...L.map(k=>k.t.GC)))return'Paredão'}
  if(rr>=2)return'Açougueiro';
  if(yy>=9||(rr>=1&&yy>=7))return'Sarrafeiro';

      c.pl.forEach(p=>{const part=anyPj&&c.t.J?Math.min(1,(p.pj||0)/c.t.J):1;if(part<0.5)return;let sc=(p.s-60)*0.8+p.g*W[p.p]+tb*part;if((p.p==='G'||p.p==='D')&&c.t.GC===minGC)sc+=6*part;C.push({sc:sc*MULT[d-1],n:p.n,club:c.name,c,g:p.g,p:p.p})})})}

function repair6(){const D=DS[S.ds||'0506'],OLD=[72,62,54,46],NEWB=[84,74,64,54],u=club(S.user),avgS=c=>c.pl.reduce((t,p)=>t+p.s,0)/c.pl.length;

function restore7(){const D=DS[S.ds||'0506'],byName={},cnt={},back=[];S.clubs.forEach(c=>byName[c.name]=c);

function rMarket(){const u=club(S.user);
  let h=`<div class="win"><div class="tb">Mercado de transferências</div><div class="pc"><div class="row">${[['T','Todos'],['G','Goleiros'],['D','Defensores'],['M','Meias'],['A','Atacantes']].map(([k,l])=>`<button class="btn sm${UI.mpos===k?' on':''}" onclick="UI.mpos='${k}';rMarket()">${l}</button>`).join('')}</div>
    <div class="row" style="margin-top:6px">${[0,1,2,3,4].map(d=>`<button class="btn sm${UI.mdiv===d?' on':''}" onclick="UI.mdiv=${d};rMarket()">${d?'D'+d:'Todas'}</button>`).join('')}</div>
    <input id="mkq" type="search" placeholder="🔎 Buscar jogador ou clube" value="${esc(UI.mq||'')}" oninput="UI.mq=this.value;document.getElementById('mklist').innerHTML=mkList()" style="width:100%;margin-top:8px;font:inherit;font-size:16px;padding:7px;background:var(--field);color:var(--text);border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh)">
    <p class="muted" style="margin-bottom:0">Plantel: ${u.pl.length}/32. Mostrando os 80 melhores do filtro. Na busca, a posição e a divisão são ignoradas. A força se ajusta à divisão de quem contrata.</p></div>
    <div class="inset" id="mklist">${mkList()}</div></div>`;
  $('#main').innerHTML=h}

function rClub(){const u=club(S.user);let th=null;try{th=localStorage.getItem(TKEY)}catch(e){}
  let h=`<div class="win"><div class="tb">Treinador</div><div class="pc"><div class="row"><input id="coachEd" maxlength="30" value="${esc(S.coach||'Treinador')}" aria-label="Nome do treinador" class="grow" style="font:inherit;font-size:16px;padding:6px;background:var(--field);color:var(--text);border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);min-width:0"><button class="btn sm" onclick="setCoach()">Salvar</button></div></div></div><div class="win"><div class="tb">Estádio</div><div class="pc"><div class="kv"><span>Nome</span><b>${u.st}</b><span>Capacidade</span><b>${fN(u.cap)} lugares</b><span>Localização</span><b>${CITY[u.name]?CITY[u.name]+' · '+CN[u.cty]:CN[u.cty]}</b><span>Público no último jogo em casa</span><b>${S.fin.att?fN(S.fin.att):'—'}</b></div>
    <p class="muted">Ampliar custa €3.000 por lugar. Limite: 130.000.</p><div class="row">${[5000,10000,20000].map(n=>`<button class="btn" style="flex:1" onclick="expand(${n})">+${fN(n)}<br><b>${fm(n*3000)}</b></button>`).join('')}</div>
    <div class="row" style="margin-top:10px"><span class="grow">Preço do ingresso</span><button class="btn sm" onclick="setPrice(-5)">−5</button><span class="led" style="font-size:22px">€${S.price}</span><button class="btn sm" onclick="setPrice(5)">+5</button></div>
    <p class="muted" style="margin-bottom:0">Ingresso caro enche menos o estádio.</p></div></div>`;
  {const Q=S.aud||{s:0,n:0,hist:[],max:0,maxT:''},tn=Q.n+Q.hist.reduce((t,x)=>t+x.n,0),ts=Q.s+Q.hist.reduce((t,x)=>t+x.sum,0);
    h+=`<div class="win"><div class="tb">Público</div><div class="pc"><div class="kv"><span>Média nesta temporada</span><b>${Q.n?fN(Q.s/Q.n):'—'}</b><span>Jogos em casa nesta temporada</span><b>${Q.n}</b><span>Média histórica</span><b>${tn?fN(ts/tn):'—'}</b><span>Recorde</span><b>${Q.max?fN(Q.max):'—'}</b></div>${Q.maxT?`<p class="muted" style="margin:4px 0 0;text-align:right">contra ${Q.maxT}</p>`:''}<p class="muted" style="margin:6px 0 0">Conta os jogos em casa da liga e da Copa.</p></div>${Q.hist.length?`<div class="scroll"><table class="t"><tr><th class="l">Temporada</th><th>Div.</th><th>Jogos</th><th>Média</th></tr>${Q.hist.map(x=>`<tr><td class="l"><b>${x.s}</b></td><td>${x.div}</td><td>${x.n}</td><td>${fN(x.sum/x.n)}</td></tr>`).join('')}</table></div>`:''}</div>`}
  {const L=S.led||{},LBL=[['gate','Bilheteria'],['tv','Cota de TV'],['spon','Patrocínio master'],['merch','Material esportivo e lojas'],['prize','Prêmios'],['sbonus','Bônus do patrocinador'],['wages','Salários dos jogadores'],['coach','Salário do treinador'],['stad','Manutenção do estádio'],['travel','Viagens'],['youth','Base e estrutura']],
    net=Object.values(L).reduce((x,y)=>x+y,0),line=([k,t])=>{const v=L[k]||0;return `<span>${t}</span><b style="color:${v<0?'var(--bad)':v>0?'var(--good)':'inherit'}">${v>0?'+':''}${fm(v)}</b>`},fam=1+(PRESTIGE[u.name]||0)/8,dv=u.div-1;
    h+=`<div class="win"><div class="tb">Finanças</div><div class="pc"><div class="kv"><span>Caixa</span><b style="color:${u.money<0?'var(--bad)':'inherit'}">${fm(u.money)}</b></div>${u.money<0?'<p style="color:var(--bad);margin:6px 0 0">Caixa negativo: a diretoria fica mais insatisfeita a cada rodada.</p>':''}
      <div class="dl">Acumulado na temporada</div><div class="kv inset pc">${LBL.filter(([k])=>k==='gate'||k==='tv'||L[k]).map(line).join('')}<span><b>Saldo da temporada</b></span><b style="color:${net<0?'var(--bad)':'var(--good)'}">${net>0?'+':''}${fm(net)}</b></div>
      ${S.ledPrev?`<p class="muted" style="margin:6px 0 0">Temporada anterior: saldo de ${fm(Object.values(S.ledPrev).reduce((x,y)=>x+y,0))}.</p>`:''}
      
      <p class="muted" style="margin:6px 0 0">Soma de tudo o que entrou e saiu desde a 1ª rodada desta temporada. Fechar a temporada no vermelho irrita a diretoria.</p></div></div>`}
  h+=`<div class="win"><div class="tb">Opções</div><div class="pc"><div class="row"><span class="grow">Pausar no intervalo</span><button class="btn sm${S.pauseHT?' on':''}" onclick="togglePauseHT()">${S.pauseHT?'Ligado':'Desligado'}</button></div>
    <div class="row" style="margin-top:8px"><span class="grow">Tema</span>${[['auto','Sistema'],['light','Claro'],['dark','Escuro']].map(([k,l])=>`<button class="btn sm${(th||'auto')===k?' on':''}" onclick="setTheme('${k}')">${l}</button>`).join('')}</div>
    <div class="row" style="margin-top:12px"><button class="btn" style="flex:1" onclick="exportSlot()">💾 Exportar esta carreira</button></div><div class="row" style="margin-top:8px"><button class="btn" style="flex:1" onclick="confirmNew()">Trocar de carreira / novo jogo</button></div></div></div>`;
  $('#main').innerHTML=h}

applyTheme();render();
</script>
<script>
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update()})}).catch(()=>{});
  let _rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(_rl||LIVE)return;_rl=true;location.reload()});
}
let _inst=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();_inst=e;const b=document.getElementById('instBtn');if(b)b.style.display='block'});
window.addEventListener('appinstalled',()=>{const b=document.getElementById('instBtn');if(b)b.style.display='none'});
function instApp(){if(!_inst)return;_inst.prompt();_inst.userChoice.finally(()=>{_inst=null;document.getElementById('instBtn').style.display='none'})}
</script>
<button id="instBtn" onclick="instApp()" style="display:none;position:fixed;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:70;font:bold 14px Tahoma,Verdana,sans-serif;padding:10px 14px;background:#c3c3c3;color:#000;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:2px 2px 0 #000;cursor:pointer">📲 Instalar app</button>

</html>
